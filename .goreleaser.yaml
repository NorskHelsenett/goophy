# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - id: goophy
    env:
      - CGO_ENABLED=0
    main: ./cmd/goophy
    binary: goophy
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
  # Legacy-named copies of the same archives (e.g.
  # goophy_legacy_macos_arm64.tar.gz, goophy_legacy_linux_amd64.tar.gz). The
  # self-updater in v0.2.2 and earlier only matches assets whose names contain "macos" (for darwin) and Go's arch name
  # ("amd64"), so without these, existing installs on macOS and on x86_64
  # Linux/Windows cannot run `goophy update`. Keep these for a few releases
  # until users are on a version with the fixed matcher. The "legacy" infix
  # keeps names distinct from the default ones on case-insensitive systems.
  - id: legacy
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_legacy_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

# Homebrew cask, published to the NorskHelsenett/homebrew-tap repository:
#   brew install norskhelsenett/tap/goophy
# Only stable releases are published (not -rc prereleases), and only when the
# HOMEBREW_TAP_GITHUB_TOKEN secret is set, so releases keep working without it.
homebrew_casks:
  - name: goophy
    ids: [default]
    binaries: [goophy]
    homepage: https://github.com/NorskHelsenett/goophy
    description: Authenticating proxy for Ollama, vLLM and OpenAI-compatible APIs
    license: MIT
    repository:
      owner: NorskHelsenett
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    skip_upload: '{{ if or .Prerelease (eq (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") "") }}true{{ else }}false{{ end }}'
    commit_msg_template: "goophy {{ .Tag }}"
    hooks:
      post:
        # The binaries aren't notarized; without this, Gatekeeper refuses to
        # run a freshly downloaded goophy.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/goophy"]
          end
    caveats: |
      Upgrade with `brew upgrade goophy`; `goophy update` is disabled for Homebrew installs.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Tags like v0.3.0-rc.1 are previews: a prerelease is not GitHub's
  # "latest release", so the self-updater does not offer it to everyone.
  prerelease: auto
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
